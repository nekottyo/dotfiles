# Tempo 設定
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    # ダッシュボードの既定表示期間 (24h) に合わせる
    block_retention: 24h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    # 送り先が無いと service-graphs / span-metrics の生成メトリクスは捨てられる
    remote_write:
      - url: http://mimir:9009/api/v1/push
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    span_metrics:
      # 既定は上限 16.384s までで、llm_request や interaction がまるごと +Inf に落ちて
      # p95 が上限値に張り付く。既定の 2 倍刻みをそのまま延長する。
      # 262.144s まで延ばした時点で llm_request は収まった (実測 p99 91.1s) が、
      # interaction はターン全体でユーザーの思考時間と承認待ちを含むため依然張り付く。
      # 人間が数十分考えるターンを捉えられるよう 2097.152s (約 35 分) まで伸ばす。
      # 境界を変えると変更前後の series が混在し、跨いだ窓では bucket の単調性が崩れて
      # p95 が最大境界に張り付いて見える。lookback が抜ける (最大 24h) までの一時的な症状
      histogram_buckets:
        [
          0.002, 0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.256, 0.512, 1.024,
          2.048, 4.096, 8.192, 16.384, 32.768, 65.536, 131.072, 262.144,
          524.288, 1048.576, 2097.152,
        ]

overrides:
  defaults:
    metrics_generator:
      # service-graphs は現状 0 series。辺は CLIENT スパンと SERVER スパンのペアから作られるが、
      # Claude Code のスパンは全て SPAN_KIND_INTERNAL のため。将来 kind が増えたときのために残す
      processors: [service-graphs, span-metrics]
