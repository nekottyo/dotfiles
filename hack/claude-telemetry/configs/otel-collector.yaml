# OTel Collector 設定
# Claude Code から OTLP で受け取り、Loki / Tempo / Mimir へ転送する
# Headroom だけは push ではなく collector からの scrape で取り込む

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Headroom proxy の Prometheus エンドポイントを scrape する。
  # 公式 docker image に opentelemetry SDK が同梱されておらず、HEADROOM_OTEL_METRICS_*
  # による push は派生 image のビルドを強いるため、既に公開されている /metrics を引きに行く。
  prometheus/headroom:
    config:
      scrape_configs:
        - job_name: headroom
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["host.docker.internal:8787"]

processors:
  # メモリ使用量を制限する
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  # バッチ送信でパフォーマンスを向上させる
  batch:
    timeout: 5s

exporters:
  # メトリクス → Mimir (Prometheus Remote Write)
  prometheusremotewrite:
    endpoint: http://mimir:9009/api/v1/push
    tls:
      insecure: true

  # トレース → Tempo (OTLP HTTP)
  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true

  # ログ → Loki (OTLP HTTP)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # デバッグ用 (コンテナログに出力)
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus/headroom]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
